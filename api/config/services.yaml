parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    App\Infrastructure\Hue\HueClient:
        arguments:
            $bridgeUrl: '%env(string:HUE_BRIDGE_URL)%'

    App\Infrastructure\Hue\HuePairingService:
        arguments:
            $bridgeUrl: '%env(string:HUE_BRIDGE_URL)%'

    App\Infrastructure\Integration\CredentialStore:
        arguments:
            $projectDir: '%kernel.project_dir%'
