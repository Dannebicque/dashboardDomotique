parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    App\Infrastructure\Hue\HueClient:
        arguments:
            $bridgeUrl: '%env(string:HUE_BRIDGE_URL)%'
            $applicationKey: '%env(string:HUE_APPLICATION_KEY)%'
